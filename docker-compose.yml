services:
  api:
    build: ./api
    environment:
      PORT: "8080"
      DB_PATH: /data/brezelle.db
      JWT_SECRET: ${JWT_SECRET:-brezelle-compose-secret-change-me}
      CORS_ORIGIN: http://localhost:3000
    volumes:
      - brezelle-data:/data
    ports:
      - "8080:8080"

  web:
    build: ./web
    environment:
      API_URL: http://api:8080
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  brezelle-data:
