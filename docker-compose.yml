services:
  postgres:
    image: postgres:16-alpine
    container_name: odontoagenda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odontoagenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odontoagenda}
      POSTGRES_DB: ${POSTGRES_DB:-odontoagenda}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-odontoagenda} -d ${POSTGRES_DB:-odontoagenda}',
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: odontoagenda-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://odontoagenda:odontoagenda@postgres:5432/odontoagenda?schema=public}
      JWT_SECRET: ${JWT_SECRET:-chave_secreta_padrao_para_desenvolvimento_local_32_chars}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3000/api/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      sh -c "cd backend && npx prisma migrate deploy && node dist/src/server.js"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    container_name: odontoagenda-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --spider -q http://localhost/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
